plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karadeniz.sadeev'
    compileSdk 34

    defaultConfig {
        applicationId 'com.karadeniz.sadeev'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Kişisel kullanım: release de debug anahtarıyla imzalanır, direkt kurulabilir.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
